<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kenjineer Games Studio — Identity</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef3;color:#173f65;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px}h1{font-size:20px;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{min-height:240px;display:flex;align-items:center;justify-content:center;padding:24px;background:white}.dark{background:#08152d;color:#f3f7ff}.symbol{width:200px;height:200px}.lockup{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:760}.lockup img{width:40px;height:40px}.sizes{gap:24px}.colors{display:flex;margin-top:16px}.colors div{flex:1;padding:24px 12px;font-size:12px}@media(max-width:640px){.grid{grid-template-columns:1fr}.panel{min-height:180px}.colors{flex-wrap:wrap}.colors div{flex-basis:50%}}
</style>
<main>
<h1>Kenjineer Games Studio / Identity</h1>
<div class="grid">
<div class="panel dark"><img class="symbol" src="kgs-mark-sky.png" alt="Sky-blue interlocking K symbol"></div>
<div class="panel"><img class="symbol" src="kgs-mark-master.png" alt="Dark-blue interlocking K symbol"></div>
<div class="panel dark"><div class="lockup"><img src="kgs-mark-sky.png" alt="">Kenjineer Games Studio</div></div>
<div class="panel dark sizes"><img src="kgs-mark-sky.png" width="32" height="32" alt="32 pixel mark"><img src="kgs-mark-sky.png" width="40" height="40" alt="40 pixel mark"><img src="kgs-mark-sky.png" width="64" height="64" alt="64 pixel mark"></div>
</div>
<div class="colors"><div style="background:#08152d;color:#f3f7ff">Night · #08152D</div><div style="background:#94c9fa">Sky · #94C9FA</div><div style="background:#173f65;color:#f3f7ff">Ink · #173F65</div><div style="background:#f3f7ff">Text · #F3F7FF</div></div>
</main>
</html>
